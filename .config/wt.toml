# Worktrunk config for SIPGURU
# Hooks run when creating/merging worktrees for parallel agent work

[pre-start]
# Install deps if needed
install_backend = "uv sync --frozen"
install_frontend = "npm ci"

[post-start]
# Copy env example if missing
env = "test -f .env || cp .env.example .env 2>/dev/null || true"

[pre-merge]
# Run verification before merge
verify = "./verify.sh"

[post-merge]
notify = "echo 'Merged {{branch}} to main'"
